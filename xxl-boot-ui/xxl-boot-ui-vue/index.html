<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="/favicon.ico">
    <title>欢迎进入系统</title>
    <!--[if lt IE 11]>
    <script>window.location.href = '/ie.html';</script>
    <![endif]-->
    <style>
        /* 全局基础样式配置 */
        html,
        body,
        #app {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Chrome 框架兼容性提示样式 */
        .chromeframe {
            margin: 0.2em 0;
            background: #ccc;
            color: #000;
            padding: 0.2em 0;
        }

        /* 页面加载动画容器样式 */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
        }

        /* 主加载动画：现代圆点脉冲样式 */
        #loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
        }

        /* 加载动画圆点 */
        #loader span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3c8dbc;
            opacity: 0.2;
            /* 圆点依次延迟，形成从左到右的脉冲波浪 */
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        /* 第二个圆点延迟触发 */
        #loader span:nth-child(2) {
            animation-delay: 0.2s;
        }

        /* 第三个圆点延迟触发 */
        #loader span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* 圆点脉冲动画关键帧定义：放大 + 淡入淡出 */
        @keyframes dotPulse {
            0%,
            80%,
            100% {
                opacity: 0.2;
                transform: scale(0.6);
            }

            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 加载遮罩层分区样式 */
        #loader-wrapper .loader-section {
            position: fixed;
            top: 0;
            width: 51%;
            height: 100%;
            /* 遮罩层背景色：与登录页一致的浅灰色 */
            background: #d2d6de;
            z-index: 1000;
            -webkit-transform: translateX(0);
            -ms-transform: translateX(0);
            transform: translateX(0);
        }

        /* 左侧遮罩分区定位 */
        #loader-wrapper .loader-section.section-left {
            left: 0;
        }

        /* 右侧遮罩分区定位 */
        #loader-wrapper .loader-section.section-right {
            right: 0;
        }

        /* 页面加载完成后左侧遮罩滑出动画 */
        .loaded #loader-wrapper .loader-section.section-left {
            -webkit-transform: translateX(-100%);
            -ms-transform: translateX(-100%);
            transform: translateX(-100%);
            /* 加载完成过渡速度-3A：左右遮罩向两侧滑出的时长，延迟0.1s让圆圈淡出后再滑开 */
            -webkit-transition: all 0.4s 0.1s cubic-bezier(0.645, 0.045, 0.355, 1.000);
            transition: all 0.4s 0.1s cubic-bezier(0.645, 0.045, 0.355, 1.000);
        }

        /* 页面加载完成后右侧遮罩滑出动画 */
        .loaded #loader-wrapper .loader-section.section-right {
            -webkit-transform: translateX(100%);
            -ms-transform: translateX(100%);
            transform: translateX(100%);
            /* 加载完成过渡速度-3B：左右遮罩向两侧滑出的时长，延迟0.1s让圆圈淡出后再滑开 */
            -webkit-transition: all 0.4s 0.1s cubic-bezier(0.645, 0.045, 0.355, 1.000);
            transition: all 0.4s 0.1s cubic-bezier(0.645, 0.045, 0.355, 1.000);
        }

        /* 页面加载完成后加载图标淡出动画 */
        .loaded #loader {
            /* 加载完成过渡速度-1：加载完成时圆圈的淡出时长 */
            opacity: 0;
            -webkit-transition: all 0.3s ease-out;
            transition: all 0.3s ease-out;
        }

        /* 页面加载完成后整个加载容器隐藏 */
        .loaded #loader-wrapper {
            visibility: hidden;
            -webkit-transform: translateY(-100%);
            -ms-transform: translateY(-100%);
            transform: translateY(-100%);
            /* 加载完成过渡速度-2：整个容器上移隐藏的时长，延迟0.5秒等遮罩滑出后再隐藏 */
            -webkit-transition: all 0.3s 0.5s ease-out;
            transition: all 0.3s 0.5s ease-out;
        }

        /* JavaScript 禁用时的降级处理 */
        .no-js #loader-wrapper {
            display: none;
        }

        /* JavaScript 禁用时的标题样式调整 */
        .no-js h1 {
            color: #222222;
        }

        /* 加载提示文字样式 */
        #loader-wrapper .load_title {
            font-family: 'Open Sans', serif;
            color: #666;
            font-size: 19px;
            width: 100%;
            text-align: center;
            z-index: 9999999999999;
            position: absolute;
            top: 56%;
            opacity: 1;
            line-height: 30px;
        }

        /* 加载提示文字的副标题/版本信息样式 */
        #loader-wrapper .load_title span {
            font-weight: normal;
            font-style: italic;
            font-size: 13px;
            color: #999;
            opacity: 0.5;
        }
    </style>
</head>

<body>
<div id="app">
    <div id="loader-wrapper">
        <div id="loader"><span></span><span></span><span></span></div>
        <div class="loader-section section-left"></div>
        <div class="loader-section section-right"></div>
        <div class="load_title">loading</div>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>

</html>
