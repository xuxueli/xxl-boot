# docker-compose version
version: '3.8'

services:

  # ==================== 核心存储 ====================
  mysql:
    image: mysql:8.4
    container_name: xxl-boot-mysql
    environment:
      # 数据库设置：密码、数据库实例名称、时区等；
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: xxl_boot
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 数据库初始化脚本：仅数据库首次初始化时执行；
      - ../../doc/db/tables_xxl_boot.sql:/docker-entrypoint-initdb.d/tables_xxl_boot.sql:ro
      - ../../doc/db/tables_xxl_boot_monolith.sql:/docker-entrypoint-initdb.d/tables_xxl_boot_monolith.sql:ro
      # 数据库持久化目录：建议自定义；
      - ${MYSQL_PATH}/conf:/etc/mysql/conf.d
      - ${MYSQL_PATH}/logs:/var/log/mysql
      - ${MYSQL_PATH}/data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-boot-network

  # ==================== 核心服务 =====================
  xxl-boot-admin:
    image: xuxueli/xxl-boot-admin:local
    container_name: xxl-boot-admin
    pull_policy: never
    build:
      # 项目Build设置：仓库路径、Dockerfile文件位置
      context: ../../xxl-boot-admin
      dockerfile: Dockerfile
    environment:
      # 项目配置：端口、上下文路径、数据库连接等
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_boot?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root 
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --server.port=${XXL_BOOT_ADMIN_PORT}
        --server.servlet.context-path=${XXL_BOOT_ADMIN_CONTEXT_PATH}
    ports:
      - "${XXL_BOOT_ADMIN_PORT}:${XXL_BOOT_ADMIN_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - xxl-boot-network

networks:
  xxl-boot-network:
    driver: bridge
