# docker-compose version
version: '3.8'

services:

  # ==================== 核心存储 ====================
  mysql:
    image: mysql:8.4
    container_name: xxl-boot-mysql
    environment:
      # 数据库设置：密码、数据库实例名称、时区等；
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: xxl_boot
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 数据库初始化脚本：仅数据库首次初始化时执行；
      - ../../doc/db/tables_xxl_boot.sql:/docker-entrypoint-initdb.d/tables_xxl_boot.sql:ro
      - ../../doc/db/tables_xxl_boot_modular_vue.sql:/docker-entrypoint-initdb.d/tables_xxl_boot_modular_vue.sql:ro
      # 数据库持久化目录：建议自定义；
      - ${MYSQL_PATH}/conf:/etc/mysql/conf.d
      - ${MYSQL_PATH}/logs:/var/log/mysql
      - ${MYSQL_PATH}/data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-boot-network

  redis:
    image: redis:7.4
    container_name: xxl-boot-redis
    environment:
      # Redis配置：访问密码
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      # Redis持久化目录：建议自定义
      - ${REDIS_PATH}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; fi"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-boot-network

  # ==================== 核心服务 =====================
  xxl-boot-api:
    image: xuxueli/xxl-boot-api:local
    container_name: xxl-boot-api
    pull_policy: never
    build:
      # 项目Build设置：仓库路径、Dockerfile文件位置
      context: ../../xxl-boot-api
      dockerfile: Dockerfile
    environment:
      # 项目配置：端口、上下文路径、数据库连接、Redis连接等
      PARAMS: >-
        --server.port=${XXL_BOOT_API_PORT}
        --server.servlet.context-path=${XXL_BOOT_API_CONTEXT_PATH}
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_boot?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root 
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --spring.data.redis.host=redis
        --spring.data.redis.port=6379
        --spring.data.redis.password=${REDIS_PASSWORD}
    ports:
      - "${XXL_BOOT_API_PORT}:${XXL_BOOT_API_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xxl-boot-network

  xxl-boot-ui-vue:
    image: xuxueli/xxl-boot-ui-vue:local
    container_name: xxl-boot-ui-vue
    pull_policy: never
    build:
      # 项目Build设置：仓库路径、Dockerfile文件位置
      context: ../../xxl-boot-ui/xxl-boot-ui-vue
      dockerfile: Dockerfile
      # 项目Build设置：附加构建上下文，用于Nginx配置文件等
      additional_contexts:
        nginx: ./
    ports:
      - "${XXL_BOOT_UI_PORT}:80"
    depends_on:
      - xxl-boot-api
    networks:
      - xxl-boot-network

networks:
  xxl-boot-network:
    driver: bridge
